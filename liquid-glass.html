<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liquid Glass — Shader Atlas</title>
  <style>
    :root{--light:72;--refraction:34;--depth:18;--dispersion:10;--frost:7;--splay:52;--lens-x:50%;--lens-y:50%}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#08090d;color:#f7f8ff;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif}.scene{position:relative;width:100%;height:100%;isolation:isolate;background:radial-gradient(circle at 15% 24%,#ffdb79 0 4%,transparent 20%),radial-gradient(circle at 81% 23%,#ff6eb9 0 4%,transparent 22%),radial-gradient(circle at 70% 76%,#5e82ff 0 3%,transparent 26%),linear-gradient(125deg,#101a42 0%,#5043a1 42%,#d05a8c 100%);transition:background .4s}.scene:before{content:"";position:absolute;inset:-30%;z-index:-1;background:repeating-radial-gradient(circle at 55% 48%,rgba(255,255,255,.18) 0 1px,transparent 2px 18px);opacity:.5;animation:drift 18s linear infinite}.orb{position:absolute;border-radius:50%;mix-blend-mode:screen;filter:blur(1px);opacity:.9}.orb.one{width:43vw;height:43vw;left:-16vw;top:27%;background:conic-gradient(from 125deg,#ffdf70,#fb7f78,#9a68ff,#5fe0dc,#ffdf70);animation:float 13s ease-in-out infinite}.orb.two{width:31vw;height:31vw;right:-5vw;top:6%;background:conic-gradient(#69e4ff,#7987ff,#ff79c9,#ffd878,#69e4ff);animation:float 16s ease-in-out infinite reverse}.orb.three{width:34vw;height:34vw;right:17%;bottom:-18%;background:radial-gradient(circle at 30% 30%,#fff0bc,#ff8795 25%,#3c72ff 64%,transparent 67%);animation:float 11s ease-in-out infinite}.type{position:absolute;left:6vw;top:10vh;max-width:46vw;letter-spacing:-.08em;line-height:.78;font-size:clamp(42px,9vw,150px);font-weight:800;mix-blend-mode:soft-light}.type small{display:block;margin-top:26px;font-size:11px;letter-spacing:.18em;line-height:1.3;font-weight:700}.ticket{position:absolute;right:8vw;bottom:16vh;width:min(29vw,360px);padding:18px;border:1px solid rgba(255,255,255,.48);background:rgba(16,20,55,.25);box-shadow:0 12px 45px rgba(0,0,0,.2);font-size:11px;letter-spacing:.1em;line-height:1.8}.ticket b{display:block;font-size:clamp(22px,3vw,44px);letter-spacing:-.06em}.glass{position:absolute;left:var(--lens-x);top:var(--lens-y);translate:-50% -50%;width:min(62vw,680px);aspect-ratio:1.2/1;border-radius:calc(52px + var(--depth)*1px);overflow:hidden;isolation:isolate;box-shadow:0 calc(var(--depth)*.85px) calc(28px + var(--depth)*2px) rgba(5,9,36,.36),inset 0 1px rgba(255,255,255,.82),inset 0 -1px rgba(255,255,255,.12);background:rgba(255,255,255,calc(.05 + var(--light)/1800));backdrop-filter:blur(calc(var(--frost)*1px)) saturate(calc(1.1 + var(--light)/100)) url(#liquid-refraction);-webkit-backdrop-filter:blur(calc(var(--frost)*1px)) saturate(calc(1.1 + var(--light)/100));cursor:grab;touch-action:none}.glass:active{cursor:grabbing}.glass:before{content:"";position:absolute;inset:-14%;z-index:-1;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,calc(var(--light)/340)) 0,transparent 47%),linear-gradient(130deg,rgba(255,255,255,.16),transparent 38%,rgba(255,255,255,.02) 70%);filter:url(#liquid-refraction);opacity:.9}.glass:after{content:"";position:absolute;inset:0;border-radius:inherit;padding:calc(1px + var(--dispersion)*.11px);background:linear-gradient(105deg,rgba(82,244,255,.85),rgba(255,255,255,.82) 23%,rgba(255,129,212,.78) 52%,rgba(255,220,108,.8));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:blur(calc(var(--dispersion)*.08px));opacity:calc(.2 + var(--dispersion)/22);pointer-events:none}.glass__inner{position:absolute;inset:0;padding:clamp(24px,4vw,54px);display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.02) calc(var(--splay)*.7%),rgba(255,255,255,.09) 100%)}.glass__top{display:flex;justify-content:space-between;gap:20px;font-size:10px;letter-spacing:.17em;text-transform:uppercase;text-shadow:0 1px 12px rgba(0,0,0,.24)}.glass__top b{color:#fff3b4}.glass__copy h1{margin:0;max-width:7ch;font-size:clamp(32px,5.6vw,74px);line-height:.85;letter-spacing:-.075em;text-shadow:0 2px 24px rgba(30,15,86,.18)}.glass__copy p{max-width:35ch;margin:17px 0 0;font-size:12px;line-height:1.55;letter-spacing:.035em}.controls{position:fixed;z-index:5;left:50%;bottom:20px;translate:-50% 0;width:min(94vw,820px);display:grid;grid-template-columns:repeat(6,1fr);gap:1px;padding:1px;border:1px solid rgba(255,255,255,.35);background:rgba(8,10,24,.46);backdrop-filter:blur(18px);box-shadow:0 18px 60px rgba(0,0,0,.25)}.control{padding:10px 11px;background:rgba(255,255,255,.05)}.control label{display:flex;justify-content:space-between;gap:6px;font-size:9px;letter-spacing:.11em;text-transform:uppercase}.control output{color:#fff1ac}.control input{width:100%;margin:9px 0 0;accent-color:#fff0a1}@keyframes float{50%{translate:3vw -3vh;rotate:18deg}}@keyframes drift{to{transform:rotate(1turn)}}@media(max-width:700px){.type{max-width:80vw;top:12vh;font-size:16vw}.ticket{width:56vw;right:7vw;bottom:20vh}.glass{width:84vw;aspect-ratio:1/1.12}.controls{grid-template-columns:repeat(3,1fr);bottom:10px}.glass__copy h1{font-size:12vw}.glass__copy p{font-size:11px}.control{padding:8px}}
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false"><filter id="liquid-refraction" x="-18%" y="-18%" width="136%" height="136%"><feTurbulence id="liquid-noise" type="fractalNoise" baseFrequency=".012 .025" numOctaves="2" seed="8" result="noise"/><feDisplacementMap id="liquid-displace" in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="B"/></filter></svg>
  <main class="scene" id="scene">
    <div class="orb one"></div><div class="orb two"></div><div class="orb three"></div>
    <div class="type">Soft<br>hardware.<small>Liquid glass / background study</small></div>
    <div class="ticket">MATERIAL SYSTEM<b>Refraction 01</b>Move the lens. The edge carries the color.</div>
    <section class="glass" id="glass" aria-label="Draggable liquid glass lens"><div class="glass__inner"><div class="glass__top"><span>Atlas material</span><b>LIVE GLASS</b></div><div class="glass__copy"><h1>Liquid<br>Glass.</h1><p>Refractive deformation, depth, frost, and chromatic light are independently tunable.</p></div></div></section>
  </main>
  <section class="controls" aria-label="Liquid glass controls">
    <div class="control"><label>Light <output>72</output></label><input data-var="light" type="range" min="0" max="100" value="72"></div>
    <div class="control"><label>Refraction <output>34</output></label><input data-var="refraction" type="range" min="0" max="90" value="34"></div>
    <div class="control"><label>Depth <output>18</output></label><input data-var="depth" type="range" min="0" max="40" value="18"></div>
    <div class="control"><label>Dispersion <output>10</output></label><input data-var="dispersion" type="range" min="0" max="24" value="10"></div>
    <div class="control"><label>Frost <output>7</output></label><input data-var="frost" type="range" min="0" max="24" value="7"></div>
    <div class="control"><label>Splay <output>52</output></label><input data-var="splay" type="range" min="18" max="92" value="52"></div>
  </section>
  <script>
    const root=document.documentElement,glass=document.querySelector('#glass'),displace=document.querySelector('#liquid-displace'),noise=document.querySelector('#liquid-noise');
    document.querySelectorAll('input[data-var]').forEach(input=>input.addEventListener('input',()=>{const key=input.dataset.var,value=input.value;root.style.setProperty('--'+key,value);input.previousElementSibling.querySelector('output').value=value;if(key==='refraction'){displace.setAttribute('scale',value);noise.setAttribute('baseFrequency',`${.006+value/11000} ${.012+value/7200}`)}}));
    let drag=false;glass.addEventListener('pointerdown',event=>{drag=true;glass.setPointerCapture(event.pointerId)});glass.addEventListener('pointermove',event=>{if(!drag)return;const x=Math.max(12,Math.min(88,event.clientX/innerWidth*100)),y=Math.max(15,Math.min(78,event.clientY/innerHeight*100));root.style.setProperty('--lens-x',x+'%');root.style.setProperty('--lens-y',y+'%')});glass.addEventListener('pointerup',()=>drag=false);glass.addEventListener('pointercancel',()=>drag=false);
  </script>
</body>
</html>
